services:
  # 1. The C++ Routing Engine
  proxy:
    build: .
    ports:
      - "8080:8080/udp"
    volumes:
      - .:/app
    working_dir: /app
    networks:
      game-network:
        ipv4_address: 172.20.0.4
    command: ["./cmake-build-debug/proxy"]

  # 2. The Python Backend Workers
  backend-1:
    image: python:3.9-slim
    volumes:
      - ./backend.py:/app/backend.py
    working_dir: /app

    command: ["sh", "-c", "pip install psycopg2-binary requests && python -u backend.py"]
    networks:
      game-network:
        ipv4_address: 172.20.0.5

  backend-2:
    image: python:3.9-slim
    volumes:
      - ./backend.py:/app/backend.py
    working_dir: /app
    command: ["sh", "-c", "pip install psycopg2-binary requests && python -u backend.py"]
    networks:
      game-network:
        ipv4_address: 172.20.0.6

  backend-3:
    image: python:3.9-slim
    volumes:
      - ./backend.py:/app/backend.py
    working_dir: /app
    command: ["sh", "-c", "pip install psycopg2-binary requests && python -u backend.py"]
    networks:
      game-network:
        ipv4_address: 172.20.0.7

  # 3. The PostgreSQL Data Store
  postgres_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: firm_password
      POSTGRES_DB: auditdb
    networks:
      game-network:
        ipv4_address: 172.20.0.10

  # 4. The Web Frontend
  dashboard:
    image: python:3.9-slim
    volumes:
      - ./dashboard.py:/app/dashboard.py
    working_dir: /app
    command: ["sh", "-c", "pip install flask psycopg2-binary && python -u dashboard.py"]
    ports:
      - "3000:3000"
    networks:
      game-network:
        ipv4_address: 172.20.0.11

networks:
  game-network:
    ipam:
      config:
        - subnet: 172.20.0.0/16